# MeowLaw configuration. Copy to meowlaw.toml (or run `meowlaw init`).
# Relative paths resolve against this file's directory.

[storage]
data_dir = "data"          # meowlaw.db + index/
profiles_dir = "profiles"  # your own *.toml profiles; override built-ins by id

[server]
bind = "127.0.0.1:8080"
# Bearer token is read from this environment variable. Unset = no auth
# (only acceptable on localhost).
token_env = "MEOWLAW_TOKEN"
# Also require the token for /api/*.
protect_api = false
# Browser origins allowed to call /mcp. Clients that send no Origin header
# (Claude Desktop, Claude Code, CLI tools) are always allowed.
allowed_origins = ["http://localhost:8080", "http://127.0.0.1:8080"]
ui_dir = "ui"
mcp_name = "meowlaw"
# Ingest page at /admin.html (upload, preview, check changes, ingest, remove).
# Needs the token when one is set; without a token, only on a localhost bind.
allow_ingest = false
max_upload_mb = 200

[branding]
name = "MeowLaw"
tagline = "Open legal research for any jurisdiction"
logo = "ui/brand/logo.svg"
favicon = "ui/brand/favicon.svg"
footer = "Not legal advice. Check every source against the official version."
font_body = "system-ui, -apple-system, 'Segoe UI', sans-serif"
font_heading = "Georgia, 'Times New Roman', serif"
font_mono = "ui-monospace, 'SFMono-Regular', Menlo, monospace"

# Any key here becomes a CSS custom property (--primary, --bg, ...).
[branding.colors]
bg = "#fbfaf7"
surface = "#ffffff"
surface-2 = "#f3f1ec"
text = "#1d1b18"
muted = "#6b665e"
border = "#e4e0d8"
primary = "#5a3fd6"
primary-contrast = "#ffffff"
accent = "#e0832b"
highlight = "#fff1b8"
link = "#4630b8"

[branding.dark]
bg = "#141311"
surface = "#1c1b18"
surface-2 = "#25231f"
text = "#ece9e2"
muted = "#a39d92"
border = "#34312b"
primary = "#9d8bff"
primary-contrast = "#141311"
accent = "#f0a259"
highlight = "#5a4a12"
link = "#b7a9ff"

# Groups in the left drawer, in order. A source joins the first group listing
# its kind (legislation, instrument, rule_set, case, treaty, guidance,
# secondary). To place one source elsewhere, set `group = "..."` in its
# front matter, sidecar or corpus.toml [meta]. Add, rename or reorder freely.
[[source_groups]]
label = "Legislation"
kinds = ["legislation", "instrument"]

[[source_groups]]
label = "Case law"
kinds = ["case"]

[[source_groups]]
label = "Regulatory resources"
kinds = ["guidance", "treaty", "rule_set", "secondary"]

# Optional dense vectors. Any OpenAI-compatible endpoint works, including a
# local Ollama (`ollama pull nomic-embed-text`). Run `meowlaw embed` after ingest.
# [embeddings]
# url = "http://localhost:11434/v1/embeddings"
# model = "nomic-embed-text"
# api_key_env = "OPENAI_API_KEY"
# batch = 32

# Optional machine-generated summaries (`meowlaw summarise`). Replaces the
# placeholder summary (opening text) of rulings, cases, guidance and books
# that have no supplied summary. Each is labelled "machine-generated (<model>),
# not reviewed". Supplied summaries are never replaced.
# [summaries]
# url = "http://localhost:11434/v1/chat/completions"   # any OpenAI-compatible chat endpoint
# model = "llama3.1"
# api_key_env = "OPENAI_API_KEY"   # only if the endpoint needs a key
# words = 200
# max_input_chars = 24000
# auto = false                     # also run after `meowlaw sync` and ingest-page uploads

# Optional per-corpus access control. See docs/access.md.
# [access]
# default = "public"
# anonymous = ["public"]
# [access.corpora]
# "handbook-*" = "internal"
# [[access.tokens]]
# name = "staff"
# env = "MEOWLAW_TOKEN_STAFF"
# tags = ["public", "internal"]
