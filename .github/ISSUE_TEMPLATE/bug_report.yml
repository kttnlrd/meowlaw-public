name: Bug report
description: Something in the reader, API, MCP server or CLI misbehaves
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security problems here — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The behaviour you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. meowlaw ingest examples/au-tax/sources.toml
        2. open http://127.0.0.1:8080/#/node/itaa-1997:s8-1
        3. click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `meowlaw --version`, the tag, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Web UI
        - REST API
        - MCP server
        - CLI / ingest
        - Extraction, citations or graph
        - Build, Docker or CI
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Server logs, console errors, or the command output. Leave secrets out.
      render: shell
    validations:
      required: false
