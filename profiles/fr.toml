# France. STARTER PROFILE (French-language).
#
# Needs review by a lawyer qualified in France before it is relied on.
# Structure follows the Codes as published on Légifrance; citation forms were
# checked against Conseil d'État and Cour de cassation decisions. No
# definition patterns yet.
#
# Known gap: Légifrance headings write "Article L624-5" while decisions cite
# "article L. 624-5". The engine compares numbers with whitespace removed but
# keeps the dot, so the dotted form does not yet resolve to the undotted heading.

id = "fr"
name = "France (starter)"
description = "Structure des codes (Livre, Titre, Sous-titre, Chapitre, Section, Sous-section, Paragraphe, Article L/R/D), citations « article L. 521-2 du code de justice administrative », lois et décrets numérotés, ECLI, pourvois."
language = "fr"

# 1240, L624-5, L. 521-2, R. 122-3, L345-2-2, A623-1.
# Sources: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000019984028 ("Article L624-5")
#          https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032041571 ("Article 1240")
#          https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2024-10-11/498032 ("articles L. 345-2-2 et L. 345-2-3")
number = '(?:[LRDA]\.?\s?[0-9]+(?:-[0-9]+)*|[0-9]+(?:-[0-9]+)*)'

# ---------------------------------------------------------------------------
# Structure. Légifrance headings: "LIVRE VI : ...", "TITRE II : ...",
# "Sous-titre II : ...", "Chapitre Ier : ...", "Section 3 : ...",
# "Sous-section 1 : ...", "Paragraphe 1 : ...".
# Sources: https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006113743 (LIVRE VI, code de commerce)
#          https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006133197 (TITRE II)
#          https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070721/LEGISCTA000032021486/ (Sous-titre II)
#          https://www.legifrance.gouv.fr/codes/id/LEGISCTA000032021488/ (Chapitre Ier)
#          https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000005634379/LEGISCTA000006161365/2026-04-27 (Section 3)
#          https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006070633/LEGISCTA000006192688/ (Sous-section 1)
#          https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074075/LEGISCTA000031210411/ (Paragraphe 1)
# ---------------------------------------------------------------------------

[[levels]]
label = "Livre"
abbrev = "livre"
rank = 10
pattern = '^(?i:livre)\s+(?P<num>[IVXLC]+(?:er)?|[0-9]+(?:er)?)\b\s*(?P<title>.*)$'

[[levels]]
label = "Titre"
abbrev = "titre"
rank = 20
pattern = '^(?i:titre)\s+(?P<num>[IVXLC]+(?:er)?|[0-9]+(?:er)?)\b\s*(?P<title>.*)$'

[[levels]]
label = "Sous-titre"
abbrev = "stitre"
rank = 25
pattern = '^(?i:sous-titre)\s+(?P<num>[IVXLC]+(?:er)?|[0-9]+(?:er)?)\b\s*(?P<title>.*)$'

[[levels]]
label = "Chapitre"
abbrev = "ch"
rank = 30
pattern = '^(?i:chapitre)\s+(?P<num>[IVXLC]+(?:er)?|[0-9]+(?:er)?)\b\s*(?P<title>.*)$'

[[levels]]
label = "Section"
abbrev = "sec"
rank = 40
pattern = '^(?i:section)\s+(?P<num>[0-9]+)\b\s*(?P<title>.*)$'

[[levels]]
label = "Sous-section"
abbrev = "ssec"
rank = 45
pattern = '^(?i:sous-section)\s+(?P<num>[0-9]+)\b\s*(?P<title>.*)$'

[[levels]]
label = "Paragraphe"
abbrev = "par"
rank = 48
pattern = '^(?i:paragraphe)\s+(?P<num>[0-9]+)\b\s*(?P<title>.*)$'

[[levels]]
label = "Article"
abbrev = "art"
rank = 50
kind = "provision"
pattern = '^(?i:article)\s+(?P<num>{NUM})\b\s*(?P<title>.*)$'

# ---------------------------------------------------------------------------
# Citations.
# ---------------------------------------------------------------------------

# "article L. 521-2 du code de justice administrative",
# "article R. 122-3 du code de l'environnement",
# "l'article 1382, devenu 1240, du code civil". Only the first article of a
# list ("articles L. 511-1 et L. 521-2") is captured.
# Sources: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2022-09-20/451129
#          https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2024-10-11/498032
#          https://www.courdecassation.fr/decision/61d54570d1f0ab0518749068 (pourvoi n° 20-11.837)
# Code names: Légifrance titles (code civil, code de commerce, code pénal,
# code du travail, code de l'urbanisme, code de procédure civile, code général
# des collectivités territoriales).
[[citations]]
name = "fr_article_du_code"
target = { type = "provision", label = "Article" }
pattern = '\b(?:[Aa]rticles?|[Aa]rt\.)\s+(?:{NUM},\s+devenu\s+)?(?P<nums>{NUM}(?:(?:\s*,\s*|\s+(?:et|à)\s+){NUM})*),?\s+du\s+(?P<corpus>[Cc]ode\s+(?:civil|pénal|de\s+commerce|du\s+travail|de\s+l[\x27’]urbanisme|de\s+l[\x27’]environnement|de\s+justice\s+administrative|de\s+procédure\s+civile|général\s+des\s+collectivités\s+territoriales))'

# Bare "article L. 521-2" (legislative/regulatory article without a named code).
# Source: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2022-09-20/451129
[[citations]]
name = "fr_article"
target = { type = "provision", label = "Article" }
pattern = '\b(?:[Aa]rticles?|[Aa]rt\.)\s+(?P<nums>[LRD]\.\s?[0-9]+(?:-[0-9]+)+(?:(?:\s*,\s*|\s+(?:et|à)\s+)[LRD]\.\s?[0-9]+(?:-[0-9]+)+)*)'

# "loi n° 78-17 du 6 janvier 1978", "décret n° 2020-548 du 11 mai 2020".
# Source: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2020-06-26/441065
[[citations]]
name = "fr_loi_decret"
target = { type = "corpus" }
pattern = '\b(?P<corpus>(?:loi|décret)\s+n°\s?[0-9]{2,4}-[0-9]{1,4}\s+du\s+[0-9]{1,2}(?:er)?\s+[a-zéû]+\s+[12][0-9]{3})'

# ECLI as printed by the Conseil d'État and Cour de cassation:
# ECLI:FR:CECHR:2022:451129.20220920, ECLI:FR:CCASS:2016:CO00191.
# Sources: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2022-09-20/451129
#          https://www.courdecassation.fr/publications_26/arrets_publies_2986/chambre_commerciale_financiere_economique_3172/2016_7408/mars_7411/191_1er_33765.html
[[citations]]
name = "ecli"
target = { type = "case" }
pattern = '\b(?P<cite>ECLI:[A-Z]{2}:[A-Z0-9.]{1,7}:[0-9]{4}:[A-Za-z0-9.]{1,25})'

# Cour de cassation appeal numbers: "Pourvoi n°20-11.837", "pourvoi n° 23-17.962".
# Sources: https://www.courdecassation.fr/decision/61d54570d1f0ab0518749068
#          https://www.courdecassation.fr/decision/67189208d8ceca1cd7018c8a
[[citations]]
name = "fr_pourvoi"
target = { type = "case" }
pattern = '\b[Pp]ourvoi\s+n°\s?(?P<cite>[0-9]{2}-[0-9]{2}\.[0-9]{3})'

# Numbered paragraphs ("1. ", "10. ") in Conseil d'État decisions.
# Source: https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2022-09-20/451129
[cases]
paragraph = '^\s*(?P<num>[0-9]{1,3})\.\s+\S'

[definitions]
# "Chapitre Ier : Définitions et principes." (code des postes et des communications électroniques)
# Source: https://www.legifrance.gouv.fr/codes/id/LEGIARTI000049571421/2024-05-23
section_titles = '(?i)\bdéfinitions?\b'

[label_aliases]
"art" = "Article"
"articles" = "Article"

# Map code names to the corpus IDs you ingest, e.g.
#   "code civil" = "code-civil"
#   "Code civil" = "code-civil"
[corpus_aliases]
