# South Africa. STARTER PROFILE.
#
# Needs review by a lawyer qualified in South Africa before it is relied on.
# Citation forms were checked against Constitutional Court judgments
# (concourt.org.za) and SAFLII case pages. Statute structure is inherited
# from `generic`.
#
# Extends `generic`; only the differences are listed here.

id = "za"
name = "South Africa (starter)"
description = "SA neutral citations ([2021] ZACC 18, ZASCA), SA Law Reports/BCLR/SACR/All SA with court suffix, 'at para 12' pinpoints, Acts cited as 'Electoral Act 73 of 1998', SAFLII links."
extends = "generic"
language = "en-ZA"

# ---------------------------------------------------------------------------
# Citations.
# ---------------------------------------------------------------------------

# Neutral citations with "at para 12" pinpoint. Identifiers seen in the
# Constitutional Court's own judgments: ZACC, ZASCA, ZALAC, ZAECHC. Other
# High Court identifiers are matched by generic `neutral_citation`.
# Sources: https://www.concourt.org.za/images/Judgment_CCT_158-23_One_Movement_South_Africa_NPC_v_President_of_the_R.pdf
#          https://collections.concourt.org.za/bitstream/handle/20.500.12144/36786/Judgment%20CCT%2052-21%20JG%20Zuma%20v%20Secretary%20of%20the%20Judicial%20Commission%20of%20Inquiry%20into%20Allegations%20of%20State%20Capture%20and%20Others.pdf?sequence=57&isAllowed=y
[[citations]]
name = "za_neutral"
target = { type = "case" }
pattern = '(?P<cite>\[[12][0-9]{3}\]\s+(?:ZACC|ZASCA|ZALAC|ZAECHC)\s+[0-9]{1,5})(?:\s+at\s+paras?\s+(?P<pin>[0-9]{1,4}))?'

# Report series with court suffix: 1995 (3) SA 391 (CC), 1996 (1) BCLR 1 (CC),
# 2019 (1) SACR 429 (CC) (ConCourt judgments above); [2023] 4 All SA 644 (SCA),
# [2026] 1 BLLR 1 (SCA), (2007) 28 ILJ 133 (CC) (SAFLII case titles:
#   https://www.saflii.org/za/cases/ZASCA/2023/132.html
#   https://www.saflii.org/za/cases/ZASCA/2025/165.html
#   https://www.saflii.org/za/cases/ZACC/2007/21.html)
[[citations]]
name = "za_report"
target = { type = "case" }
pattern = '(?P<cite>[12][0-9]{3}\s+\([0-9]{1,2}\)\s+(?:SA|BCLR|SACR)\s+[0-9]{1,5}\s+\([A-Z]{1,4}\)|\[[12][0-9]{3}\]\s+[0-9]\s+(?:All\s+SA|BLLR)\s+[0-9]{1,5}\s+\([A-Z]{1,4}\)|\([12][0-9]{3}\)\s+[0-9]{1,3}\s+ILJ\s+[0-9]{1,5}\s+\([A-Z]{1,4}\))(?:\s+at\s+paras?\s+(?P<pin>[0-9]{1,4}))?'

# "section 31B(3) of the Electoral Act 73 of 1998".
# Source: https://www.concourt.org.za/images/Judgment_CCT_158-23_One_Movement_South_Africa_NPC_v_President_of_the_R.pdf
[[citations]]
name = "za_section_of_act"
target = { type = "provision", label = "Section" }
pattern = '\b(?:[Ss]ections?|ss?\.?)\s+(?P<nums>{NUM}(?:\([0-9A-Za-z]{1,6}\))*(?:\s*(?:,|and|or|to)\s*{NUM}(?:\([0-9A-Za-z]{1,6}\))*)*)\s+of\s+the\s+(?P<corpus>(?:[A-Z][\w’\x27()\-]*\s+(?:(?:and|of|for|the|in|on|to)\s+)?){1,10}Act,?\s+[0-9]{1,3}\s+of\s+[12][0-9]{3})'

# An Act named in text: "Electoral Amendment Act 1 of 2023".
# Source: same judgment.
[[citations]]
name = "za_act"
target = { type = "corpus" }
pattern = '\b(?P<corpus>(?:[A-Z][\w’\x27()\-]*\s+(?:(?:and|of|for|the|in|on|to)\s+)?){1,10}Act\s+[0-9]{1,3}\s+of\s+[12][0-9]{3})'

# ---------------------------------------------------------------------------
# SAFLII. URL pattern confirmed from real case pages:
#   https://www.saflii.org/za/cases/ZACC/2021/18.html
#   https://www.saflii.org/za/cases/ZACC/2023/38.html
#   https://www.saflii.org/za/cases/ZASCA/2022/159.html
#   https://www.saflii.org/za/cases/ZASCA/2023/132.html
# ---------------------------------------------------------------------------
[[links]]
label = "SAFLII"
citation = '^\[(?P<year>[12][0-9]{3})\]\s+(?P<court>ZACC|ZASCA)\s+(?P<num>[0-9]+)$'
url = "https://www.saflii.org/za/cases/{court}/{year}/{num}.html"

# Add short titles for the Acts you ingest, e.g.
#   "Income Tax Act" = "income-tax-act-58-of-1962"
[corpus_aliases]
