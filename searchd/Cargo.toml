[package]
name = "usearch-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
usearch = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tantivy = "0.26.2"
memmap2 = "0.9.11"
rayon = "1.12.0"

[profile.release]
opt-level = 3
