[package]
name = "lawkitty-desktop"
version = "0.1.0"
edition = "2021"
description = "LawKitty for Windows: a native reader over a downloaded data folder"
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[[bin]]
name = "LawKitty"
path = "src/main.rs"

[dependencies]
# The data engine, without its HTTP server.
lawkitty-local = { path = "../local-app", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
kurbo = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Quicker builds while working on it: `cargo build --profile fast`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
