[package]
name = "meowlaw-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
meowlaw-core = { version = "0.1.0", path = "../meowlaw-core" }
meowlaw-ingest = { version = "0.1.0", path = "../meowlaw-ingest" }
meowlaw-lint = { version = "0.1.0", path = "../meowlaw-lint" }
meowlaw-mcp = { version = "0.1.0", path = "../meowlaw-mcp" }
meowlaw-search = { version = "0.1.0", path = "../meowlaw-search" }
meowlaw-store = { version = "0.1.0", path = "../meowlaw-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"

[features]
default = ["local-embed"]
local-embed = ["meowlaw-search/local-embed"]
