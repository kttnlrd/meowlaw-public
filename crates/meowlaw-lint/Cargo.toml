[package]
name = "meowlaw-lint"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Pre-ingest linter for MeowLaw legal source files"

[dependencies]
anyhow = "1.0.104"
meowlaw-core = { version = "0.1.0", path = "../meowlaw-core" }
meowlaw-ingest = { version = "0.1.0", path = "../meowlaw-ingest" }
quick-xml = "0.42.0"
regex = "1.13.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
walkdir = "2.5.0"
zip = "9.0.4"

[dev-dependencies]
tempfile = "3.27.0"
