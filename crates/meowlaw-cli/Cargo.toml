[package]
name = "meowlaw-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
meowlaw-core = { version = "0.1.0", path = "../meowlaw-core" }
meowlaw-extract = { version = "0.1.0", path = "../meowlaw-extract" }
meowlaw-ingest = { version = "0.1.0", path = "../meowlaw-ingest" }
meowlaw-lint = { version = "0.1.0", path = "../meowlaw-lint" }
walkdir = "2.5.0"
meowlaw-mcp = { version = "0.1.0", path = "../meowlaw-mcp" }
meowlaw-search = { version = "0.1.0", path = "../meowlaw-search" }
meowlaw-server = { version = "0.1.0", path = "../meowlaw-server" }
meowlaw-store = { version = "0.1.0", path = "../meowlaw-store" }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "meowlaw"
path = "src/main.rs"
