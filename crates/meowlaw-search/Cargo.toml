[package]
name = "meowlaw-search"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
meowlaw-core = { version = "0.1.0", path = "../meowlaw-core" }
meowlaw-extract = { version = "0.1.0", path = "../meowlaw-extract" }
meowlaw-ingest = { version = "0.1.0", path = "../meowlaw-ingest" }
meowlaw-lint = { version = "0.1.0", path = "../meowlaw-lint" }
meowlaw-store = { version = "0.1.0", path = "../meowlaw-store" }
rayon = "1.12.0"
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tantivy = "0.26.2"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
toml = "1.1.8"
tract-onnx = { version = "0.23.9", optional = true }
ureq = "3.4.2"
walkdir = "2.5.0"

[dev-dependencies]
meowlaw-ingest = { path = "../meowlaw-ingest" }


[features]
default = ["local-embed"]
# Local ONNX embeddings (pure Rust: tract + tokenizers).
local-embed = ["dep:tract-onnx", "dep:tokenizers"]
