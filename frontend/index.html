<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lawkitty</title>
  <script src="/app/theme-init.js"></script>
  <link rel="icon" type="image/png" href="/app/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/app/favicon-180.png">
  <link rel="manifest" href="/app/manifest.webmanifest">
  <meta name="theme-color" content="#120d17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lawkitty">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--color-desktop, var(--color-bg, #120d17));
      color: var(--color-text, #f7eee2);
    }
    #root { height: 100vh; display: flex; flex-direction: column; }
    .resize-handle { cursor: col-resize; }
    .resize-handle:hover { background: #c6f432; }
    .resize-handle.dragging { background: #c6f432; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/app/assets/yarn.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
